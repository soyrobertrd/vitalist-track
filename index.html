  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA — but NEVER in iframe/preview contexts
      // to avoid stale caches in embedded previews.
      (function () {
        var inIframe = true;
        try { inIframe = window.self !== window.top; } catch (_) { inIframe = true; }
        var host = window.location.hostname;
        var isPreview = host.includes('-git-') || host === 'localhost';

        if ('serviceWorker' in navigator) {
          if (inIframe || isPreview) {
            // Clean up any previously registered SW in preview contexts.
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          } else {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/sw.js').catch(function () {});
            });
          }
        }
      })();
    </script>
  </body>
